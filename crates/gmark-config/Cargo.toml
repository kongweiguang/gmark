# @author kongweiguang

[package]
name = "gmark-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
directories = "6"
gmark-document-core = { path = "../gmark-document-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1.23", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
