# @author kongweiguang

[package]
name = "gmark-markdown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["html-native"]
html-native = ["dep:tree-sitter", "dep:tree-sitter-html"]

[dependencies]
ammonia = "=4.1.3"
cssparser = "0.37"
html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"
pulldown-cmark = "0.13"
regex = "1"
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
unicode-segmentation = "1.13"
url = "2"
