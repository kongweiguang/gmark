# @author kongweiguang
name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Windows workspace and feature gates
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo run -p xtask -- quality
      - run: cargo check -p gmark --locked --no-default-features
      - run: cargo check -p gmark --locked --no-default-features --features code-highlight-core,html-native
      - run: cargo check -p gmark --locked
      - run: cargo check -p gmark --locked --all-features
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked -j 1
      - run: cargo test -p gmark-fuzz-support --test corpus_replay --locked -j 1
      - name: Validate workflow YAML
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/validate-workflows.py
